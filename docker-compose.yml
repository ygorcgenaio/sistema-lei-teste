services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sistema_lei}
      MYSQL_USER: ${MYSQL_USER:-lei_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - lei_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-sistema_lei}
      DB_USER: ${MYSQL_USER:-lei_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      LEI_ADMIN_EMAIL: ${LEI_ADMIN_EMAIL:-}
      LEI_ADMIN_PASSWORD: ${LEI_ADMIN_PASSWORD:-}
      LEI_ADMIN_NAME: ${LEI_ADMIN_NAME:-Administrador LEI}
      LEI_ADMIN_MATRICULA: ${LEI_ADMIN_MATRICULA:-}
      LEI_ADMIN_TELEFONE: ${LEI_ADMIN_TELEFONE:-}
      DB_MIGRATION_MAX_ATTEMPTS: ${DB_MIGRATION_MAX_ATTEMPTS:-30}
      DB_MIGRATION_RETRY_DELAY_MS: ${DB_MIGRATION_RETRY_DELAY_MS:-2000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - lei_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  lei_db_data:
  lei_uploads:
